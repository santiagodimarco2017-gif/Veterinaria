plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.fcv.unidadvet'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.fcv.unidadvet.dosis'
        minSdk 24
        targetSdk 35
        // En CI se pasa -PbuildNumber=<n> para que cada APK sea una versión mayor.
        versionCode((project.findProperty('buildNumber') ?: '1') as int)
        versionName "1.0.${project.findProperty('buildNumber') ?: '0'}"
    }

    // La clave de firma NO está en el repo: en CI se arma desde los secrets
    // KEYSTORE_BASE64 y KEYSTORE_PASSWORD. Con una clave fija, cada APK nuevo
    // se instala como actualización del anterior.
    def ks = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        if (ks) {
            unidadvet {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'unidadvet'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sin secrets se firma con la clave de depuración (instala igual,
            // pero puede pedir desinstalar la versión anterior al actualizar).
            signingConfig ks ? signingConfigs.unidadvet : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
