name: Compilar APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/unidadvet.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/unidadvet.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secret KEYSTORE_BASE64: se firma con clave de depuración."
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk DosisVet-FCV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DosisVet-FCV-apk
          path: DosisVet-FCV.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dosis Vet FCV v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK de la calculadora de dosis (perros y gatos).
            Descargá **DosisVet-FCV.apk** desde el celular e instalalo (permitir "instalar apps de origen desconocido").
          files: DosisVet-FCV.apk
          make_latest: true
